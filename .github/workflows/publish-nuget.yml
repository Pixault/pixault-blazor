name: Publish to NuGet

# Tag-driven release. Bump <Version> + RELEASES.md, commit, push, then push a v<version>
# tag — CI verifies the tag matches the csproj version, packs with release notes from
# RELEASES.md, and publishes to nuget.org via Trusted Publishing (OIDC). No API key.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Get version from csproj
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/Pixault.Blazor/Pixault.Blazor.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "csproj version: $VERSION"

      - name: Verify tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v$TAG does not match csproj <Version> ${{ steps.version.outputs.version }}. Bump the csproj (and RELEASES.md) to match the tag."
            exit 1
          fi
          echo "Tag v$TAG matches the csproj version."

      - name: Extract release notes from RELEASES.md
        id: notes
        run: |
          V="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v v="$V" '
            $0 ~ "^## +"v"([^0-9]|$)" {grab=1; next}
            grab && /^## / {grab=0}
            grab {print}
          ' RELEASES.md 2>/dev/null | sed '/^[[:space:]]*$/d')
          [ -z "$NOTES" ] && NOTES="Release $V"
          {
            echo "notes<<__NOTES_EOF__"
            echo "$NOTES"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Pixault.Blazor/Pixault.Blazor.csproj

      - name: Build
        run: dotnet build src/Pixault.Blazor/Pixault.Blazor.csproj -c Release --no-restore

      # Gate on tests when there are any. This package has none yet, so the step reports that
      # and passes; it starts enforcing the moment a project appears under test/, without the
      # workflow needing to be revisited. No --no-build: the Build step above compiles only the
      # src project, so --no-build would find no test assembly and exit 0 having run nothing.
      - name: Test
        run: |
          shopt -s nullglob
          PROJECTS=(test/*/*.csproj test/*.csproj)
          if [ ${#PROJECTS[@]} -eq 0 ]; then
            echo "No test project under test/ — nothing to gate on yet."
            exit 0
          fi
          for p in "${PROJECTS[@]}"; do
            echo "Running $p"
            dotnet test "$p" -c Release --logger "console;verbosity=normal"
          done

      - name: Check if version exists on NuGet
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/pixault.blazor/${{ steps.version.outputs.version }}/pixault.blazor.nuspec")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} already exists — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} is new — will publish"
          fi

      # Notes reach MSBuild through an env var rather than the command line, and
      # ',' / ';' are escaped. Interpolating them directly breaks on ordinary prose: a
      # backtick becomes command substitution, and everything after the first comma is
      # read as a separate MSBuild switch. Both failed real publishes on 2026-09-09.
      - name: Pack
        if: steps.check.outputs.exists == 'false'
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          ESCAPED=$(printf '%s' "$NOTES" | sed 's/%/%25/g; s/,/%2C/g; s/;/%3B/g')
          dotnet pack src/Pixault.Blazor/Pixault.Blazor.csproj -c Release --no-build -o ./nupkg \
            -p:PackageReleaseNotes="$ESCAPED"

      - name: Login to NuGet via trusted publisher
        id: nuget-login
        if: steps.check.outputs.exists == 'false'
        uses: NuGet/login@v1
        with:
          user: endpointsystems

      - name: Push to NuGet
        if: steps.check.outputs.exists == 'false'
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
